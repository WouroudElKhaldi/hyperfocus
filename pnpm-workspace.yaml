packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  lefthook: true # installs the git hooks (P1-09)
  prisma: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - turbo@2.11.6
# Security: every Prisma 6 release pins deepmerge-ts 7 (GHSA-ggr8-5vv4-36mx). Remove when Prisma is upgraded (P4-02).
overrides:
  deepmerge-ts: ^8.0.0
