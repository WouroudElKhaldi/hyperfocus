# Every push to main and every pull request: install → typecheck → lint → API tests (unit + contract) → route check → browser tests.
# Nothing here talks to real services: the API tests run against a throwaway PostgreSQL started for the run (below),
# with a fake AI and a fake n8n, and Gmail is switched off (see apps/api/test/support/stack.js), so no secrets are needed.
# Requiring this check before merging into main is one setting on GitHub: Settings → Branches → add a rule for main →
# "Require status checks to pass" → pick "Typecheck, lint and tests".
name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the database the tests use (each test run makes its own schemas in it, and drops them)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hyperfocus
          POSTGRES_PASSWORD: hyperfocus-local
          POSTGRES_DB: hyperfocus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hyperfocus -d hyperfocus_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://hyperfocus:hyperfocus-local@localhost:5432/hyperfocus_test
      DATABASE_URL: postgresql://hyperfocus:hyperfocus-local@localhost:5432/hyperfocus_test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # the pnpm version comes from "packageManager" in package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore the Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Package tests (shared schemas, AI gateway)
        run: pnpm test:packages

      - name: Website unit tests (data cache rules)
        run: pnpm --filter @hyperfocus/web test

      - name: API tests (unit + contract)
        run: pnpm test:api

      - name: Every API route has a contract test
        run: pnpm --filter @hyperfocus/api test:routes

      # CI uses Playwright's own Chromium (locally the tests use your installed Chrome, see playwright.config.js)
      - name: Install the browser for the browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - name: Keep the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/report
            e2e/results
          retention-days: 14
