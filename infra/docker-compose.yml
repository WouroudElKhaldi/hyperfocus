# The local database for Hyperfocus (P4-01): PostgreSQL 17 in Docker, free and open source (PostgreSQL License).
#   pnpm db:up     start it (data is kept in the "hyperfocus-pg" volume between restarts)
#   pnpm db:down   stop it (the data stays)
#   pnpm db:admin  also start pgAdmin at http://localhost:5050 to browse the tables (optional)
# Port 5433 on this computer, so it never clashes with another PostgreSQL already on 5432.
# Local only: the password is for this computer; cloud databases get their own secrets (Phase 6).
name: hyperfocus

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hyperfocus
      POSTGRES_PASSWORD: hyperfocus-local
      POSTGRES_DB: hyperfocus
    ports:
      - "127.0.0.1:5433:5432" # only this computer can reach it
    volumes:
      - hyperfocus-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperfocus -d hyperfocus"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["admin"] # only with `pnpm db:admin`
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hyperfocus.local
      PGADMIN_DEFAULT_PASSWORD: hyperfocus-local
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  hyperfocus-pg:
